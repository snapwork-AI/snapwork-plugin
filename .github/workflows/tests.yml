# The plugin's tests on Linux, macOS and Windows. On Windows they run in Git Bash, the shell
# Claude Code runs hooks in there.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test_sh: dash
          - os: ubuntu-latest
            test_sh: bash --posix
          - os: macos-latest
            test_sh: sh
          - os: windows-latest
            test_sh: sh
    name: ${{ matrix.os }} (${{ matrix.test_sh }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Checked out with the runner's own git settings, as a person's computer would.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python for the state file check
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: python3 on Windows
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/shim/python3"
          chmod 755 "$RUNNER_TEMP/shim/python3"
          cygpath -w "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
      - name: Scripts are LF
        run: "! git ls-files --eol | grep -E '^i/[a-z]+ +w/crlf'"
      - name: Tests
        env:
          TEST_SH: ${{ matrix.test_sh }}
        run: sh tests/run.sh
